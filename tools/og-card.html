<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social card</title>
    <style>
      @font-face {
        font-family: 'Instrument Serif';
        font-style: normal;
        font-weight: 400;
        src: url('../public/fonts/instrument-serif-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        font-weight: 400;
        src: url('../public/fonts/instrument-serif-400-italic.woff2') format('woff2');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* 1200x630 — the one size every platform agrees on. */
      body {
        width: 1200px;
        height: 630px;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        background: #0a0908;
        color: #ece7db;
        font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }

      .left {
        padding: 66px 52px 66px 70px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-right: 1px solid rgb(200 200 210 / 0.25);
      }

      .mark {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 30px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: #f2f3f5;
      }

      .mark i {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 28%, #ffffff, #c8c9ce 55%, #8a8d94);
        display: inline-grid;
        place-items: center;
        font-style: normal;
        font-size: 17px;
        color: #101012;
      }

      h1 {
        font-family: 'Instrument Serif', Georgia, serif;
        font-weight: 400;
        font-size: 82px;
        line-height: 1;
        letter-spacing: -0.025em;
      }

      h1 em {
        font-style: italic;
        color: #c8c9ce;
      }

      .role {
        font-size: 21px;
        color: #e6e6e9;
        margin-top: 22px;
        max-width: 34ch;
        line-height: 1.5;
      }

      .site {
        font-size: 16px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #b3b3ba;
      }

      .right {
        position: relative;
        background:
          radial-gradient(420px 300px at 60% 40%, rgb(200 200 210 / 0.35), transparent 70%),
          radial-gradient(700px 500px at 80% 90%, rgb(200 200 210 / 0.12), transparent 60%),
          #121214;
      }

      .right::after {
        content: 'JT';
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 220px;
        color: transparent;
        background: linear-gradient(100deg, #6e7076, #c8c9ce 30%, #ffffff 50%, #c8c9ce 70%, #6e7076);
        -webkit-background-clip: text;
        background-clip: text;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <span class="mark"><i>J</i> Justice Thinker</span>

      <div>
        <h1>Justice Thinker</h1>
        <p class="role">Software, physics, debate.</p>
      </div>

      <span class="site">justicethinker.com</span>
    </div>

    <div class="right"></div>
  </body>
</html>
